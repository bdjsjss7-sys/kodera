name: KODERA quality gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Audit content and build
        run: npm run check
      - name: Check production routes
        run: |
          set -eu
          npm run start > /tmp/kodera-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          for path in / /works /advertising /advertising/google-ads /services /pricing /ru /by /blog /contact /works/noir-objects; do
            curl -fsS "http://127.0.0.1:3000$path" > /dev/null || { cat /tmp/kodera-server.log; exit 1; }
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/works/real/klarwerk)
          test "$status" = "404"
